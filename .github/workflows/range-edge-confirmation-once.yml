name: PhilBot - pre-registered confirmation one-time
on:
  push:
    branches:
      - research/range-edge-once-20261029
    paths:
      - .github/workflows/range-edge-confirmation-once.yml
permissions:
  contents: write
concurrency:
  group: philbot-range-confirmation-20261029
  cancel-in-progress: false
jobs:
  test_one_hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated source and frozen preregistration
        run: |
          test -s research/edge-first/confirmation_pre_register.md
          python3 -m py_compile research/edge-first/range_edge_once.py research/edge-first/range_edge_confirmation_once.py
      - name: Reverify official Binance archives and test one 4h confirmation rule
        run: python3 research/edge-first/range_edge_confirmation_once.py
      - name: Preserve tested results if available
        if: always()
        run: |
          if [ -s research/edge-first/confirmation_results_20261029.json ]; then
            git config user.name "philbot-research-bot"
            git config user.email "research@users.noreply.github.com"
            git add research/edge-first/confirmation_results_20261029.json
            if ! git diff --cached --quiet; then
              git commit -m "research: record 4h confirmation study [skip ci]"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range-confirmation-results
          path: research/edge-first/confirmation_results_20261029.json
          if-no-files-found: ignore
