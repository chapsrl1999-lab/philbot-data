name: actions-5min
on:
  push:
    branches: [research/actions-5min]
  workflow_dispatch:
    inputs:
      passe: { description: "Numéro de la passe (relance automatique)", required: false, default: "1" }
permissions:
  contents: write
concurrency:
  group: actions-5min
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        instr: [AAPL, ADBE, AMD, AMZN, APP, ARM, ASML, AVGO, BABA, COST, CRCL, CRM, CRWD, DELL, DIS, DKNG, GME, GOOGL, GS, HOOD, IBM, INTC, JPM, KO, LLY, MARA, MSFT, MU, NET, NFLX, NOW, NVDA, NVO, ORCL, PANW, PDD, PLTR, PYPL, QCOM, RDDT, RIVN, SHOP, SMCI, SNOW, SOFI, TSLA, TSM, TXN, UBER, V, WMT, ZM, USA500IDX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Reprise des données déjà téléchargées
        run: git fetch -q origin "d5-${{ matrix.instr }}" && git checkout -q FETCH_HEAD -- data || true
      - run: python research_data/fetch_duka_5m.py
        env: { INSTR: "${{ matrix.instr == 'USA500IDX' && 'USA500IDXUSD' || format('{0}USUSD', matrix.instr) }}" }
      - name: Commit data
        if: always()
        run: |
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git checkout --orphan "d5-${{ matrix.instr }}"
          git rm -r --cached -q . || true
          git add -f data
          git commit -q -m "Dukascopy ${{ matrix.instr }} (5 min, depuis les fichiers 1 min)" && git push -f origin "d5-${{ matrix.instr }}"

  # Relance automatique : une nouvelle passe tant que le plafond n'est pas atteint (dépôt public : minutes gratuites).
  # Un push fait avec le jeton du workflow ne relance rien ; workflow_dispatch, oui.
  relance:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    permissions: { actions: write, contents: read }
    steps:
      - name: Passe suivante
        env:
          GH_TOKEN: ${{ github.token }}
          PASSE: ${{ github.event.inputs.passe || '1' }}
          MAX: "12"
        run: |
          n=$((PASSE + 1))
          if [ "$n" -le "$MAX" ]; then
            gh workflow run actions5.yml -R "${{ github.repository }}" --ref research/actions-5min -f passe="$n"
            echo "passe $n lancée"
          else
            echo "plafond de $MAX passes atteint : arrêt"
          fi
