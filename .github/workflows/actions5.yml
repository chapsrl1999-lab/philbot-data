name: actions-yahoo
on:
  push:
    branches: [research/actions-5min]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actions-5min
  cancel-in-progress: true
jobs:
  yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research_data/fetch_yahoo.py
        env: { SHARD: "${{ matrix.shard }}", NSHARD: "6" }
      - name: Commit data
        if: always()
        run: |
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git checkout --orphan "yh-${{ matrix.shard }}"
          git rm -r --cached -q . || true
          git add -f data
          git commit -q -m "Yahoo, lot ${{ matrix.shard }}" && git push -f origin "yh-${{ matrix.shard }}"
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research_data/diag_duka.py
      - name: Commit
        if: always()
        run: |
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git checkout --orphan "diag-duka"
          git rm -r --cached -q . || true
          git add -f data
          git commit -q -m "Diagnostic Dukascopy" && git push -f origin "diag-duka"
