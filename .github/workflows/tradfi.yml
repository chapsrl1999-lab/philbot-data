name: tradfi-data
on:
  push:
    branches: [research/tradfi-data]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tradfi-data
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        instr: [XAUUSD, USATECHIDXUSD, AAPLUSUSD, MSFTUSUSD, NVDAUSUSD, AMZNUSUSD,
                GOOGLUSUSD, METAUSUSD, TSLAUSUSD, AMDUSUSD, NFLXUSUSD, AVGOUSUSD, PLTRUSUSD, COINUSUSD, MSTRUSUSD, MUUSUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research_data/fetch_duka.py
        env: { INSTR: "${{ matrix.instr }}" }
      - name: Commit data
        if: always()
        run: |
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git checkout --orphan "data-${{ matrix.instr }}"
          git rm -r --cached -q . || true
          git add -f data
          git commit -q -m "Dukascopy ${{ matrix.instr }} (horaire)" && git push -f origin "data-${{ matrix.instr }}"
