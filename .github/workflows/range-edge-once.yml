name: PhilBot - independent range edge one-time
on:
  push:
    branches:
      - research/range-edge-once-20261029
    paths:
      - .github/workflows/range-edge-once.yml
      - research/edge-first/range_edge_once.py
permissions:
  contents: write
concurrency:
  group: philbot-edge-first-once
  cancel-in-progress: false
jobs:
  observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Python and freeze research settings
        run: |
          python3 --version
          python3 -m py_compile research/edge-first/range_edge_once.py
      - name: Verify Binance official monthly zip checksums and measure events
        run: python3 research/edge-first/range_edge_once.py
      - name: Preserve results even if some source archives are missing
        if: always()
        run: |
          if [ -f research/edge-first/results_20261029.json ]; then
            git config user.name "philbot-research-bot"
            git config user.email "research@users.noreply.github.com"
            git add research/edge-first/results_20261029.json
            if ! git diff --cached --quiet; then
              git commit -m "research: record official Binance range edge event study [skip ci]"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range-edge-once-results
          path: research/edge-first/results_20261029.json
          if-no-files-found: ignore
