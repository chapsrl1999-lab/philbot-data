name: Export three public native alias candles once
on:
  push:
    branches:
      - research/public-market-candles-20261029
    paths:
      - .github/workflows/export-public-aliases-once.yml
permissions:
  contents: read
jobs:
  three_public_aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Binance official native 1000 contract candle archives
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile,io,csv,json,gzip,re
          from pathlib import Path
          out=Path('public_aliases');out.mkdir(exist_ok=True)
          prices={};manifest=[]
          for s in ('PEPE','SHIB','FLOKI'):
              native='1000'+s+'USDT'
              name=native+'-15m-2026-09.zip'
              url='https://data.binance.vision/data/futures/um/monthly/klines/'+native+'/15m/'+name
              raw=urllib.request.urlopen(url,timeout=25).read()
              c=urllib.request.urlopen(url+'.CHECKSUM',timeout=25).read().decode().split()[0].lower()
              sha=hashlib.sha256(raw).hexdigest()
              if not re.fullmatch('[a-f0-9]{64}',c) or sha!=c:raise RuntimeError('SHA256 mismatch '+name)
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  fn=[x for x in z.namelist() if x.endswith('.csv')]
                  if len(fn)!=1:raise RuntimeError('CSV ambiguity '+name)
                  with z.open(fn[0]) as f:rs=list(csv.reader(io.TextIOWrapper(f,encoding='utf-8-sig')))
              rows=[]
              for a in rs:
                  if len(a)<5:continue
                  try:
                      t=int(a[0]);t=t//1000 if t>10**14 else t
                      o,h,l,cl=map(float,a[1:5])
                      if not(o>0 and l>0 and h>=max(o,cl) and l<=min(o,cl)):raise ValueError('OHLC')
                      rows.append([t,o,h,l,cl])
                  except ValueError:
                      if a[0].lower().replace('_','').replace(' ','')=='opentime':continue
                      raise
              if len(rows)<2700 or any(rows[i][0]-rows[i-1][0]!=900000 for i in range(1,len(rows))):raise RuntimeError('15m gap '+s)
              prices[s]=rows
              manifest.append({'symbol':s,'native':native,'rows':len(rows),'sha256':sha})
          with gzip.open(out/'aliases_15m.json.gz','wt') as f:json.dump(prices,f,separators=(',',':'))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('VERIFIED_3_OF_3',len(prices))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-native-alias-2026-09
          path: public_aliases/
          retention-days: 7
